<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeFinder | Project 005</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
background:url('/static/bg.jpg') no-repeat center center fixed;
background-size:cover;
}

.glass-card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.15);
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6 text-white">

<div class="max-w-2xl w-full">

<header class="text-center mb-10 relative">

<a href="/about"
class="absolute right-0 top-0 text-xs px-4 py-2 rounded-xl bg-white/10 border border-white/20 hover:bg-white/20 transition">
About
</a>

<h1 class="text-5xl font-light tracking-tight">
Prime<span class="font-semibold">Finder</span>
</h1>

<p class="text-gray-300 mt-2 text-sm uppercase tracking-widest opacity-80">
Project 005 • 100 Python Projects
</p>

</header>

<main class="glass-card rounded-[2.5rem] p-8 md:p-12 shadow-2xl">

<form action="/calc" method="post" class="space-y-8">

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

<div class="flex flex-col space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-gray-300 ml-2">
Starting Number
</label>

<input type="number" name="number_input" required
class="bg-white/10 border border-white/20 rounded-2xl py-4 px-6 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
placeholder="e.g. 10">
</div>

<div class="flex flex-col space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-gray-300 ml-2">
How Many Primes?
</label>

<input type="number" name="limit_input" required
class="bg-white/10 border border-white/20 rounded-2xl py-4 px-6 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
placeholder="e.g. 5">
</div>

</div>

<button type="submit"
class="w-full bg-white text-black font-semibold py-4 rounded-2xl hover:bg-gray-200 transition shadow-lg">
Generate Sequence
</button>

</form>

{% if prime_numbers %}
<div class="mt-12 pt-8 border-t border-white/10">

<h3 class="text-sm font-semibold uppercase tracking-widest text-gray-400 mb-6 text-center">
Results
</h3>

<div class="flex flex-wrap justify-center gap-3">

{% for prime in prime_numbers %}
<span class="glass-card px-5 py-2 rounded-full font-mono text-lg">
{{ prime }}
</span>
{% endfor %}

</div>
</div>
{% endif %}

</main>

<footer class="mt-10 text-center text-gray-400 text-xs">
Calculated using high-precision logic in Python
</footer>

</div>
</body>
</html>
